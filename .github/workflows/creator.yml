name: Creator pilot checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check app/creator*.py tests/test_creator*.py tests/conftest.py
      - run: ruff format --check app/creator*.py tests/test_creator*.py tests/conftest.py
      - run: mypy app/creator*.py --check-untyped-defs
      - run: node --check static/creator.js
      - run: python -m pytest -q
